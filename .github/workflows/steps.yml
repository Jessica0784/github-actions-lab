name: Steps Examples

on:
  push:
  workflow_dispatch:

jobs:
  steps-example:
    runs-on: ubuntu-latest
    steps:
      - name: Create directory
        run: mkdir testmachine

      - name: Write uname output to file
        run: uname -a > testmachine/output.txt

      - name: Show contents of output.txt
        run: cat testmachine/output.txt

      - name: Show directory listing and contents
        run: ls -alhR
